<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:rgba(0,0,0,0.4);flex-shrink:0}
.hud-info{display:flex;gap:16px;font-size:0.9rem;color:rgba(255,255,255,0.8)}
.btn{padding:4px 14px;border:none;border-radius:14px;color:#fff;cursor:pointer;font-size:0.78rem;background:linear-gradient(135deg,#f39c12,#e74c3c)}
.btn:hover{opacity:0.85}
.hud-hint{color:rgba(255,255,255,0.4);font-size:0.75rem}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);width:min(90vw,calc(90vh - 60px));aspect-ratio:1;gap:clamp(4px,1vmin,10px);background:rgba(255,255,255,0.05);padding:clamp(6px,1.2vmin,14px);border-radius:12px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:clamp(1rem,3.5vmin,2rem);font-weight:bold;transition:all .15s}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-info"><span id="score">得分: 0</span><span class="hud-hint">方向键/WASD/滑动</span></div>
  <button class="btn" onclick="init()">重新开始</button>
</div>
<div class="game-area"><div class="grid" id="grid"></div></div>
<script>
const colors={0:'rgba(255,255,255,0.05)',2:'#2c3e50',4:'#34495e',8:'#e67e22',16:'#d35400',32:'#e74c3c',64:'#c0392b',128:'#f1c40f',256:'#f39c12',512:'#e74c3c',1024:'#8e44ad',2048:'#667eea'};
let board,score;
function init(){board=Array(4).fill(null).map(()=>Array(4).fill(0));score=0;addTile();addTile();render()}
function addTile(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])e.push([r,c]);if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];board[r][c]=Math.random()<0.9?2:4}
function slide(row){let a=row.filter(v=>v),merged=[];for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return a}
function move(dir){let moved=false;const b=board.map(r=>[...r]);for(let i=0;i<4;i++){let line;if(dir==='left')line=board[i].slice();else if(dir==='right')line=board[i].slice().reverse();else if(dir==='up')line=[board[0][i],board[1][i],board[2][i],board[3][i]];else line=[board[3][i],board[2][i],board[1][i],board[0][i]];const r=slide(line);if(dir==='right'||dir==='down')r.reverse();for(let j=0;j<4;j++){if(dir==='left')board[i][j]=r[j];else if(dir==='right')board[i][j]=r[j];else if(dir==='up')board[j][i]=r[j];else board[3-j][i]=r[j]}for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]!==b[r][c])moved=true}if(moved){addTile();render()}}
function render(){const g=document.getElementById('grid');g.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className='cell';const v=board[r][c];d.style.background=colors[v]||'#667eea';d.style.color=v<=4?'rgba(255,255,255,0.7)':'#fff';d.textContent=v||'';g.appendChild(d)}document.getElementById('score').textContent='得分: '+score}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move('left');else if(k==='arrowright'||k==='d')move('right');else if(k==='arrowup'||k==='w')move('up');else if(k==='arrowdown'||k==='s')move('down')});
let sx,sy;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')});
init();
</script>
</body>
</html>
