<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(255,255,255,0.04);flex-shrink:0;gap:8px}
.hud-score{font-size:1.1rem;font-weight:700;color:#fbbf24}.hud-best{font-size:0.78rem;color:rgba(255,255,255,0.4)}
.btn{padding:5px 14px;border:none;border-radius:16px;color:#0a0a1a;cursor:pointer;font-size:0.75rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(251,191,36,0.3)}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,0.04);border-radius:14px;padding:8px;gap:8px;aspect-ratio:1;width:min(88vw,calc(82vh - 50px))}
.cell{border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1rem,5vmin,2.2rem);transition:all .15s;position:relative;overflow:hidden}
.cell.pop{animation:pop .2s ease-out}
.cell.merge{animation:merge .25s ease-out}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes merge{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
.game-over-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.game-over-overlay.show{display:flex}
.game-over-overlay span{font-size:1.8rem;font-weight:700}
</style>
</head>
<body>
<div class="hud">
  <span class="hud-score" id="sc">得分: 0</span>
  <span class="hud-best" id="best">最佳: 0</span>
  <button class="btn" id="restart">重新开始</button>
</div>
<div class="game-area">
  <div class="board" id="board"></div>
</div>
<div class="game-over-overlay" id="overlay"><span>🎉</span><span id="overMsg"></span><button class="btn" onclick="init()">再来一局</button></div>
<script>
const CLR={0:'rgba(255,255,255,0.03)',2:'#334155',4:'#1e40af',8:'#b45309',16:'#c2410c',32:'#dc2626',64:'#b91c1c',128:'#eab308',256:'#ca8a04',512:'#16a34a',1024:'#9333ea',2048:'#ec4899',4096:'#14b8a6',8192:'#f97316'};
let board,score,best=0;
function init(){board=Array(4).fill(null).map(()=>Array(4).fill(0));score=0;addTile();addTile();render();document.getElementById('overlay').classList.remove('show')}
function addTile(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])e.push([r,c]);if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];board[r][c]=Math.random()<0.9?2:4}
function slide(row){let a=row.filter(v=>v);for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}}while(a.length<4)a.push(0);return a}
function move(dir){const old=board.map(r=>[...r]);for(let i=0;i<4;i++){let line,rev=dir==='right'||dir==='down';if(dir==='left')line=board[i].slice();else if(dir==='right')line=board[i].slice().reverse();else if(dir==='up')line=[board[0][i],board[1][i],board[2][i],board[3][i]];else line=[board[3][i],board[2][i],board[1][i],board[0][i]];const r=slide(line);if(rev)r.reverse();if(dir==='left'||dir==='right')board[i]=r;else for(let j=0;j<4;j++)board[dir==='up'?j:3-j][i]=r[j]}let changed=false;for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]!==old[r][c])changed=true;if(changed){addTile();render()}checkGameOver()}
function checkGameOver(){if(board.flat().includes(0))return;for(let r=0;r<4;r++)for(let c=0;c<3;c++){if(board[r][c]===board[r][c+1]||(r<3&&board[r][c]===board[r+1][c]))return}best=Math.max(best,score);const max=Math.max(...board.flat());const msg=max>=2048?'恭喜达到 '+max+'!':max+'...再来一次?';document.getElementById('overMsg').textContent=msg;document.getElementById('overlay').classList.add('show')}
function render(){const g=document.getElementById('board');g.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className='cell';const v=board[r][c];d.style.background=CLR[v]||'#14b8a6';d.style.color=v<=4?'rgba(255,255,255,0.7)':'#fff';d.textContent=v||'';g.appendChild(d)}document.getElementById('sc').textContent='得分: '+score;document.getElementById('best').textContent='最佳: '+Math.max(best,score)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move('left');else if(k==='arrowright'||k==='d')move('right');else if(k==='arrowup'||k==='w')move('up');else if(k==='arrowdown'||k==='s')move('down')});
let sx,sy;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')});document.getElementById('restart').addEventListener('click',init);
init();
</script>
</body>
</html>
