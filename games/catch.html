<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接水果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(255,255,255,0.04);flex-shrink:0;gap:8px}
.hud-item{font-size:0.85rem;color:rgba(255,255,255,0.8)}.hud-item span{font-weight:700;color:#34d399}
.btn{padding:5px 14px;border:none;border-radius:16px;color:#fff;cursor:pointer;font-size:0.75rem;font-weight:600;background:linear-gradient(135deg,#34d399,#10b981);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(52,211,153,0.3)}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
canvas{border-radius:8px;box-shadow:0 0 30px rgba(52,211,153,0.06);touch-action:none}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-item">得分: <span id="sc">0</span></div>
  <div class="hud-item">生命: <span id="li">5</span></div>
  <span style="font-size:0.68rem;color:rgba(255,255,255,0.3);margin-left:auto">鼠标/触摸移动</span>
  <button class="btn" id="restart">重新开始</button>
</div>
<div class="game-area"><canvas id="c"></canvas></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,basket,items,score,lives,over,anim,spawnTimer,combo,comboTimer;
const FRUITS=[
  {e:'🍎',p:1,speed:1.2,r:16},{e:'🍊',p:2,speed:1.2,r:16},{e:'🍋',p:3,speed:1.3,r:16},
  {e:'🍇',p:5,speed:1.1,r:16},{e:'🍓',p:8,speed:1.4,r:16},{e:'🍑',p:4,speed:1.3,r:16},
  {e:'💎',p:15,speed:1.8,r:14},{e:'⭐',p:20,speed:2,r:14},
  {e:'💣',p:-1,speed:1.5,r:16}
];
function resize(){const area=document.querySelector('.game-area');W=c.width=Math.min(area.clientWidth-16,420);H=c.height=Math.min(area.clientHeight-16,Math.round(W*1.4));W=Math.max(W,280);H=Math.max(H,380)}
function getX(e){const r=c.getBoundingClientRect();const cx=(e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left;return cx*W/r.width}
function init(){resize();basket={x:W/2,w:64};items=[];score=0;lives=5;over=false;combo=0;comboTimer=0;clearInterval(spawnTimer);spawnTimer=setInterval(spawn,Math.max(300,700-score*3));cancelAnimationFrame(anim);anim=requestAnimationFrame(loop)}
function spawn(){if(over)return;const badChance=0.03+lives*0.02;const isBad=Math.random()<badChance;const pool=isBad?[FRUITS[8]]:FRUITS.slice(0,7);const f=pool[Math.floor(Math.random()*pool.length)];items.push({x:15+Math.random()*(W-30),y:-20,e:f.e,p:f.p,speed:f.speed+Math.random()*1.5+score*0.002,r:f.r,rot:0,rotSpeed:(Math.random()-0.5)*0.1})}
function update(){if(over)return;comboTimer--;if(comboTimer<=0)combo=0;items.forEach(it=>{it.y+=it.speed;it.rot+=it.rotSpeed});const missed=[];items=items.filter(it=>{if(it.y>H+30){if(it.p>0){missed.push(it);lives--;shake();if(lives<=0)endGame()}return false}if(it.y>=H-50&&it.y<=H-15&&Math.abs(it.x-basket.x)<basket.w/2+it.r/2){if(it.p===-1){lives=Math.max(0,lives-2);shake();if(lives<=0)endGame();return false}combo++;comboTimer=30;const bonus=Math.min(combo,10);score+=it.p+bonus;spawnParticles(it.x,it.y,it.p+bonus);return false}return true});document.getElementById('sc').textContent='得分: '+score;document.getElementById('li').textContent='生命: '+lives}
function shake(){c.style.transform='translateX('+(Math.random()*10-5)+'px)';setTimeout(()=>c.style.transform='',100)}
function spawnParticles(x,y,pts){for(let i=0;i<ptSpawn(pts);i++)items.push({x,y,e:pts>15?'💫':'✨',p:0,speed:-(1.5+Math.random()*2),r:10,rot:0,rotSpeed:0.3,life:15,temp:true});function ptSpawn(p){return Math.min(p,8)}}
function endGame(){over=true;clearInterval(spawnTimer);setTimeout(()=>alert('💥 游戏结束! 得分: '+score),100)}
function draw(){ctx.fillStyle='#0d0d2b';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.02)';for(let y=40;y<H;y+=60){ctx.fillRect(0,y,W,1)}ctx.fillStyle='rgba(139,90,43,0.6)';ctx.beginPath();ctx.roundRect(basket.x-basket.w/2,H-30,basket.w,20,8);ctx.fill();ctx.fillStyle='rgba(139,90,43,0.3)';ctx.beginPath();ctx.roundRect(basket.x-basket.w/2-5,H-35,basket.w+10,8,4);ctx.fill();items.forEach(it=>{if(it.temp){ctx.globalAlpha=it.life/15;ctx.font='14px sans-serif';ctx.fillText(it.e,it.x-7,it.y);ctx.globalAlpha=1}else{ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText(it.e,0,it.r/2);ctx.restore()}});ctx.textAlign='start';if(combo>1){ctx.fillStyle='rgba(251,191,36,0.8)';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('🔥 x'+combo,W/2,40);ctx.textAlign='start'}if(over){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('游戏结束',W/2,H/2-10);ctx.font='14px system-ui';ctx.fillText('得分: '+score,W/2,H/2+15);ctx.textAlign='start'}items=items.filter(it=>!it.temp||it.life-->0)}
function loop(){if(!over){update();draw();anim=requestAnimationFrame(loop)}else draw()}
c.addEventListener('mousemove',e=>{basket.x=Math.max(basket.w/2,Math.min(W-basket.w/2,getX(e)))});
c.addEventListener('touchmove',e=>{e.preventDefault();basket.x=Math.max(basket.w/2,Math.min(W-basket.w/2,getX(e)))},{passive:false});
c.addEventListener('touchstart',e=>{e.preventDefault()},{passive:false});
document.getElementById('restart').addEventListener('click',init);
window.addEventListener('resize',()=>{resize();draw()});
init();
</script>
</body>
</html>
