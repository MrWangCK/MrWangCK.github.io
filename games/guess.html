<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猜数字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
.game-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px;background:rgba(255,255,255,0.04);border-radius:20px;border:1px solid rgba(255,255,255,0.06);width:min(90vw,380px)}
h2{font-size:1.5rem;background:linear-gradient(135deg,#c084fc,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#range{font-size:0.9rem;color:rgba(255,255,255,0.5)}
#input{padding:12px 20px;width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#fff;font-size:1.1rem;text-align:center;outline:none;transition:.2s}
#input:focus{border-color:#a855f7}
#input:disabled{opacity:0.4}
#hint{font-size:1.3rem;font-weight:700;min-height:32px;text-align:center}
#history{color:rgba(255,255,255,0.35);font-size:0.8rem;text-align:center;max-width:100%;word-wrap:break-word}
.btn{padding:10px 24px;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:0.9rem;font-weight:600;background:linear-gradient(135deg,#a855f7,#7c3aed);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,0.3)}
.attempts-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.attempt-badge{padding:4px 8px;border-radius:8px;background:rgba(255,255,255,0.06);font-size:0.75rem;font-family:monospace}
.attempt-badge.high{background:rgba(239,68,68,0.15);color:#f87171}
.attempt-badge.low{background:rgba(59,130,246,0.15);color:#60a5fa}
</style>
</head>
<body>
<div class="game-box">
  <h2>🎯 猜数字</h2>
  <div id="range">猜一个 1~100 的数字</div>
  <input id="input" type="number" min="1" max="100" placeholder="输入数字..." autocomplete="off">
  <div id="hint"></div>
  <button class="btn" id="restart">重新开始</button>
  <div class="attempts-grid" id="attempts"></div>
  <div id="history"></div>
</div>
<script>
let target,attempts,records,min=1,max=100;
function init(){target=Math.floor(Math.random()*100)+1;attempts=0;records=[];min=1;max=100;const inp=document.getElementById('input');inp.value='';inp.disabled=false;inp.focus();document.getElementById('hint').textContent='';document.getElementById('history').textContent='';document.getElementById('range').textContent='猜一个 1~100 的数字';document.getElementById('attempts').innerHTML=''}
function guess(){const v=parseInt(document.getElementById('input').value);if(isNaN(v)||v<1||v>100)return;attempts++;const d=Math.abs(v-target);let h='',color='';if(d===0){h='🎉 恭喜! '+attempts+' 次猜中!';color='#4ade80';document.getElementById('input').disabled=true;records.push({v,status:'win'})}else if(v<target){h='📈 太小了! 范围: '+v+'~'+max;color='#60a5fa';min=Math.max(min,v);records.push({v,status:'low'})}else{h='📉 太大了! 范围: '+min+'~'+v;color='#f87171';max=Math.min(max,v);records.push({v,status:'high'})}document.getElementById('hint').innerHTML='<span style="color:'+color+'">'+h+'</span>';document.getElementById('range').textContent='1~100 | 第 '+(attempts+(d===0?0:1))+' 次尝试';document.getElementById('input').value='';if(d!==0)document.getElementById('input').focus();renderAttempts()}function renderAttempts(){const grid=document.getElementById('attempts');grid.innerHTML=records.map(r=>'<span class="attempt-badge '+r.status+'">'+r.v+'</span>').join('');if(records.length>8)grid.firstChild.remove()}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')guess()});document.getElementById('restart').addEventListener('click',init);
init();
</script>
</body>
</html>
