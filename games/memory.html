<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆翻牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(255,255,255,0.04);flex-shrink:0;gap:8px}
.hud-item{font-size:0.85rem;color:rgba(255,255,255,0.8)}.hud-item span{font-weight:700;color:#f472b6}
.btn{padding:5px 14px;border:none;border-radius:16px;color:#fff;cursor:pointer;font-size:0.75rem;font-weight:600;background:linear-gradient(135deg,#ec4899,#db2777);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(236,72,153,0.3)}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(85vw,calc(80vh - 50px));aspect-ratio:1;padding:6px}
.card{perspective:500px;cursor:pointer}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:clamp(1.2rem,4vmin,2.2rem)}
.card-front{background:linear-gradient(135deg,#667eea,#764ba2);font-size:clamp(0.8rem,2.5vmin,1.4rem);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.08)}
.card-back{background:rgba(255,255,255,0.07);transform:rotateY(180deg);border:1px solid rgba(255,255,255,0.08)}
.card.matched .card-back{background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.3)}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-item">步数: <span id="mv">0</span></div>
  <div class="hud-item">配对: <span id="mp">0/8</span></div>
  <button class="btn" id="restart">重新开始</button>
</div>
<div class="game-area"><div class="board" id="board"></div></div>
<script>
const emojis=['🎮','🎯','🔥','💡','⭐','🚀','🎨','🎲'];
let flipped,moves,matches,lock;
function init(){const e=[...emojis,...emojis].sort(()=>Math.random()-0.5);flipped=[];moves=0;matches=0;lock=false;const b=document.getElementById('board');b.innerHTML='';e.forEach((v,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="card-inner"><div class="card-front">?</div><div class="card-back">'+v+'</div></div>';d.dataset.emoji=v;d.addEventListener('click',function(){flip(this)});b.appendChild(d)});updateInfo()}
function flip(card){if(lock||card.classList.contains('flipped')||card.classList.contains('matched'))return;card.classList.add('flipped');flipped.push(card);if(flipped.length===2){moves++;lock=true;if(flipped[0].dataset.emoji===flipped[1].dataset.emoji){flipped.forEach(f=>{f.classList.add('matched');setTimeout(()=>f.classList.add('matched'),0)});matches++;flipped=[];lock=false;if(matches===8)setTimeout(()=>alert('🎉 恭喜通关! 步数: '+moves),600)}else{setTimeout(()=>{flipped.forEach(f=>f.classList.remove('flipped'));flipped=[];lock=false},900)}updateInfo()}}
function updateInfo(){document.getElementById('mv').textContent=moves;document.getElementById('mp').textContent=matches+'/8'}
document.getElementById('restart').addEventListener('click',init);
init();
</script>
</body>
</html>
