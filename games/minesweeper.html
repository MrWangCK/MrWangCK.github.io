<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:rgba(0,0,0,0.4);flex-shrink:0}
.hud-info{display:flex;gap:16px;font-size:0.9rem;color:rgba(255,255,255,0.8)}
.btn{padding:4px 14px;border:none;border-radius:14px;color:#fff;cursor:pointer;font-size:0.78rem;background:linear-gradient(135deg,#3498db,#2980b9)}
.btn:hover{opacity:0.85}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.board{display:inline-grid;grid-template-columns:repeat(10,1fr);width:min(92vw,calc(92vh - 60px));aspect-ratio:1;gap:2px;background:rgba(255,255,255,0.1);padding:4px;border-radius:8px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(102,126,234,0.3);cursor:pointer;font-size:clamp(0.6rem,2vmin,0.95rem);font-weight:bold;border-radius:3px;user-select:none}
.cell.revealed{background:rgba(255,255,255,0.05);cursor:default}
.cell.mine{background:rgba(231,76,60,0.3)}
.cell.flag{background:rgba(241,196,15,0.2)}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-info"><span id="info">💣 剩余: 15 | 左键翻开 | 右键标记</span></div>
  <button class="btn" onclick="init()">重新开始</button>
</div>
<div class="game-area"><div class="board" id="board"></div></div>
<script>
const R=10,C=10,M=15;const numC=['','#3498db','#2ecc71','#e74c3c','#8e44ad','#f39c12','#1abc9c','#fff','#95a5a6'];
let grid,revealed,flagged,mines,over;
function init(){grid=Array(R).fill(null).map(()=>Array(C).fill(0));revealed=Array(R).fill(null).map(()=>Array(C).fill(false));flagged=Array(R).fill(null).map(()=>Array(C).fill(false));mines=[];over=false;let p=0;while(p<M){const r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C);if(!grid[r][c]){grid[r][c]=-1;mines.push([r,c]);p++}}for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(grid[r][c]!==-1){let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&grid[nr][nc]===-1)n++}grid[r][c]=n}render()}
function render(){const b=document.getElementById('board');b.innerHTML='';let fc=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='cell';if(revealed[r][c]){d.classList.add('revealed');if(grid[r][c]===-1)d.classList.add('mine'),d.textContent='💣';else if(grid[r][c]>0)d.textContent=grid[r][c],d.style.color=numC[grid[r][c]]}else if(flagged[r][c]){d.classList.add('flag');d.textContent='🚩';fc++}d.addEventListener('click',()=>reveal(r,c));d.addEventListener('contextmenu',e=>{e.preventDefault();flag(r,c)});b.appendChild(d)}document.getElementById('info').textContent='💣 剩余: '+(M-fc)+' | 左键翻开 | 右键标记'}
function reveal(r,c){if(over||revealed[r][c]||flagged[r][c])return;revealed[r][c]=true;if(grid[r][c]===-1){over=true;mines.forEach(([mr,mc])=>revealed[mr][mc]=true);render();setTimeout(()=>alert('💥 踩雷了!'),100);return}if(grid[r][c]===0)flood(r,c);render();checkWin()}
function flood(r,c){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&!revealed[nr][nc]&&!flagged[nr][nc]){revealed[nr][nc]=true;if(grid[nr][nc]===0)flood(nr,nc)}}}
function flag(r,c){if(over||revealed[r][c])return;flagged[r][c]=!flagged[r][c];render()}
function checkWin(){let cnt=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(revealed[r][c])cnt++;if(cnt===R*C-M){over=true;setTimeout(()=>alert('🎉 恭喜通关!'),100)}}
init();
</script>
</body>
</html>
