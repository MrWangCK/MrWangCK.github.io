<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数字华容道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(255,255,255,0.04);flex-shrink:0;gap:8px}
.hud-item{font-size:0.85rem;color:rgba(255,255,255,0.8)}.hud-item span{font-weight:700;color:#fbbf24}
.btn{padding:5px 14px;border:none;border-radius:16px;color:#0a0a1a;cursor:pointer;font-size:0.75rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(251,191,36,0.3)}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(255,255,255,0.03);border-radius:14px;padding:10px;aspect-ratio:1;width:min(85vw,calc(80vh - 50px))}
.tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-size:clamp(1rem,4vmin,1.8rem);cursor:pointer;transition:.12s;background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(245,158,11,0.25));border:1px solid rgba(251,191,36,0.2);color:#fbbf24}
.tile:hover{background:linear-gradient(135deg,rgba(251,191,36,0.35),rgba(245,158,11,0.4));transform:scale(1.03)}
.tile:active{transform:scale(0.95)}
.tile.empty{background:transparent;border:none;cursor:default}.tile.empty:hover{transform:none}
.tile.correct{background:linear-gradient(135deg,rgba(52,211,153,0.2),rgba(16,185,129,0.25));border-color:rgba(52,211,153,0.3);color:#34d399}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-item">步数: <span id="mv">0</span></div>
  <div class="hud-item">最佳: <span id="best">-</span></div>
  <button class="btn" id="restart">重新开始</button>
</div>
<div class="game-area"><div class="board" id="board"></div></div>
<script>
let tiles,moves,bestMoves=null;
function init(){tiles=[...Array(15).keys()].map(i=>i+1);tiles.push(0);let prev=-1;for(let i=0;i<300;i++){const ei=tiles.indexOf(0);const nr=Math.floor(ei/4),nc=ei%4;const dirs=[];if(nr>0&&ei-4!==prev)dirs.push(ei-4);if(nr<3&&ei+4!==prev)dirs.push(ei+4);if(nc>0&&ei-1!==prev)dirs.push(ei-1);if(nc<3&&ei+1!==prev)dirs.push(ei+1);const si=dirs[Math.floor(Math.random()*dirs.length)];prev=ei;[tiles[ei],tiles[si]]=[tiles[si],tiles[ei]]}moves=0;render()}
function render(){const b=document.getElementById('board');b.innerHTML='';tiles.forEach((v,i)=>{const d=document.createElement('div');d.className='tile'+(v===0?' empty':'');if(v===i+1&&v!==0)d.classList.add('correct');d.textContent=v||'';if(v)d.addEventListener('click',()=>move(i));b.appendChild(d)});document.getElementById('mv').textContent=moves;document.getElementById('best').textContent=bestMoves!==null?bestMoves:'-'}
function move(i){const ei=tiles.indexOf(0);const ir=Math.floor(i/4),ic=i%4,er=Math.floor(ei/4),ec=ei%4;if(Math.abs(ir-er)+Math.abs(ic-ec)!==1)return;[tiles[i],tiles[ei]]=[tiles[ei],tiles[i]];moves++;render();if(tiles.slice(0,15).every((v,i)=>v===i+1)&&tiles[15]===0){if(bestMoves===null||moves<bestMoves)bestMoves=moves;setTimeout(()=>{alert('🎉 恭喜通关! 步数: '+moves+(bestMoves!==null?' | 最佳: '+bestMoves:''))},200)}}
document.getElementById('restart').addEventListener('click',init);init();
</script>
</body>
</html>
