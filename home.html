<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .link-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .link-card .icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .link-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .link-card p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 常用导航</h1>
        <div class="links-grid">
            <a class="link-card" href="works.html">
                <div class="icon">🎨</div>
                <h3>我的作品</h3>
                <p>个人作品展示</p>
            </a>
            <a class="link-card" href="https://www.doubao.com" target="_blank">
                <div class="icon">🤖</div>
                <h3>豆包</h3>
                <p>字节跳动 AI 助手</p>
            </a>
            <a class="link-card" href="https://github.com" target="_blank">
                <div class="icon">🐙</div>
                <h3>GitHub</h3>
                <p>代码托管平台</p>
            </a>
            <a class="link-card" href="https://chat.openai.com" target="_blank">
                <div class="icon">🤖</div>
                <h3>ChatGPT</h3>
                <p>AI 对话助手</p>
            </a>
            <a class="link-card" href="https://claude.ai" target="_blank">
                <div class="icon">🧠</div>
                <h3>Claude</h3>
                <p>AI 助手</p>
            </a>
            <a class="link-card" href="https://www.notion.so" target="_blank">
                <div class="icon">📝</div>
                <h3>Notion</h3>
                <p>笔记与文档工具</p>
            </a>
            <a class="link-card" href="https://stackoverflow.com" target="_blank">
                <div class="icon">💬</div>
                <h3>Stack Overflow</h3>
                <p>程序员问答社区</p>
            </a>
            <a class="link-card" href="https://developer.mozilla.org/zh-CN/" target="_blank">
                <div class="icon">📖</div>
                <h3>MDN</h3>
                <p>Web 开发文档</p>
            </a>
            <a class="link-card" href="https://www.bilibili.com" target="_blank">
                <div class="icon">📺</div>
                <h3>Bilibili</h3>
                <p>视频学习网站</p>
            </a>
        </div>
    </div>
</body>
</html>
