<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法可视化教学 | Algorithm Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <span class="logo-text">算法可视化</span>
            </div>
            <div class="algo-tabs" id="algoTabs">
                <button class="algo-tab active" data-category="sorting">排序</button>
                <button class="algo-tab" data-category="searching">查找</button>
                <button class="algo-tab" data-category="linear">线性表</button>
                <button class="algo-tab" data-category="stack-queue">栈和队列</button>
                <button class="algo-tab" data-category="tree">树结构</button>
                <button class="algo-tab" data-category="graph">图结构</button>
                <button class="algo-tab" data-category="array">数组</button>
                <button class="algo-tab" data-category="string">串</button>
            </div>
        </div>
        <div class="header-right">
            <span class="current-algo-name" id="currentAlgoName">选择算法</span>
            <button class="theme-toggle" id="themeToggle" title="切换主题">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </header>
    <!-- 主内容 -->
    <main class="main-container">
        <!-- 左侧边栏：算法列表 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>算法列表</span>
            </div>
            <div class="algorithm-list" id="algorithmList">
                <!-- 由JS动态生成 -->
            </div>
        </aside>
        <!-- 中间区域 -->
        <div class="center-area">
            <!-- 顶部信息栏：变量状态 -->
            <div class="info-bar">
                <div class="info-section" id="infoSection">
                    <span class="info-label">状态:</span>
                    <span class="info-value" id="infoValue">--</span>
                </div>
                <div class="info-section">
                    <span class="info-label">i:</span>
                    <span class="info-value" id="infoI">-</span>
                </div>
                <div class="info-section">
                    <span class="info-label">j:</span>
                    <span class="info-value" id="infoJ">-</span>
                </div>
                <div class="info-section">
                    <span class="info-label">比较:</span>
                    <span class="info-value" id="infoCompare">-</span>
                </div>
                <div class="info-section">
                    <span class="info-label">交换:</span>
                    <span class="info-value" id="infoSwap">-</span>
                </div>
            </div>
            <!-- 可视化画布 -->
            <div class="viz-container" id="vizContainer">
                <div class="viz-canvas" id="vizCanvas">
                    <div class="placeholder-message">
                        <div class="placeholder-icon">🎬</div>
                        <p>选择一个算法开始可视化演示</p>
                    </div>
                </div>
            </div>
            <!-- 底部控制栏 -->
            <div class="control-bar">
                <div class="control-left">
                    <button class="ctrl-btn primary" id="btnStart">
                        <span>▶</span>
                    </button>
                    <button class="ctrl-btn" id="btnStepBack" title="上一步">
                        <span>⏮</span>
                    </button>
                    <button class="ctrl-btn" id="btnStep" title="下一步">
                        <span>⏭</span>
                    </button>
                    <button class="ctrl-btn" id="btnReset" title="重置">
                        <span>↺</span>
                    </button>
                </div>
                <div class="control-center">
                    <span class="step-counter" id="stepInfo">步骤: 0 / 0</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="control-right">
                    <label class="speed-label">速度</label>
                    <input type="range" class="speed-slider" id="speedSlider" min="0.25" max="4" step="0.25" value="1">
                    <span class="speed-value" id="speedValue">1x</span>
                    <button class="ctrl-btn" id="btnRandom" title="随机数据">🎲</button>
                </div>
            </div>
            <!-- 数据输入 -->
            <div class="input-bar">
                <label>输入数据:</label>
                <input type="text" id="customInput" placeholder="例如: 64, 34, 25, 12, 22">
                <button class="apply-btn" id="btnApply">应用</button>
            </div>
        </div>
        <!-- 右侧代码面板 -->
        <aside class="code-panel">
            <div class="code-header">
                <span>Python 代码</span>
                <!-- 变体切换tab -->
                <div class="variant-tabs" id="variantTabs" style="display:none;">
                    <!-- 由JS动态生成 -->
                </div>
            </div>
            <div class="code-content" id="codeContent">
                <pre class="code-block"><code>请选择一个算法</code></pre>
            </div>
            <!-- 过程记录 -->
            <div class="process-section">
                <div class="process-header">
                    <span>执行过程</span>
                    <button class="process-clear" id="btnClearProcess" title="清空">🗑</button>
                </div>
                <div class="process-list" id="processList">
                    <div class="process-empty">选择一个算法查看</div>
                </div>
            </div>
        </aside>
    </main>
    <script src="main.js"></script>
</body>
</html>
