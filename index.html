<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法可视化教学 | Algorithm Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">📊</div>
                <div class="logo-text">
                    <h1>算法可视化</h1>
                    <span>Algorithm Visualizer</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主页内容 -->
    <main class="main">
        <!-- 左侧边栏：分类和算法列表 -->
        <aside class="sidebar">
            <!-- 分类选择 -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">分类</div>
                <div class="category-list" id="categoryList">
                    <button class="category-item active" data-category="sorting">
                        <span class="category-icon">📊</span>
                        <span class="category-name">排序算法</span>
                    </button>
                    <button class="category-item" data-category="searching">
                        <span class="category-icon">🔍</span>
                        <span class="category-name">搜索算法</span>
                    </button>
                    <button class="category-item" data-category="linked-list">
                        <span class="category-icon">🔗</span>
                        <span class="category-name">链表</span>
                    </button>
                    <button class="category-item" data-category="tree">
                        <span class="category-icon">🌳</span>
                        <span class="category-name">树结构</span>
                    </button>
                    <button class="category-item" data-category="graph">
                        <span class="category-icon">🔀</span>
                        <span class="category-name">图算法</span>
                    </button>
                </div>
            </div>
            
            <!-- 算法列表 -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">算法</div>
                <div class="algorithm-list" id="algorithmList">
                    <!-- 由JS动态生成 -->
                </div>
            </div>
            
            <!-- 当前算法信息 -->
            <div class="algo-info" id="algoInfo">
                <div class="algo-name" id="currentAlgoName">选择算法</div>
                <div class="algo-complexity" id="complexityBadges"></div>
            </div>
        </aside>

        <!-- 中间可视化区域 -->
        <div class="visualization-area">
            <!-- 可视化控制栏 -->
            <div class="viz-controls">
                <div class="viz-controls-left">
                    <button class="viz-btn" id="btnStart" title="开始/暂停">
                        <span>▶</span> 开始
                    </button>
                    <button class="viz-btn" id="btnStep" title="单步执行">
                        <span>⏭</span> 单步
                    </button>
                    <button class="viz-btn" id="btnReset" title="重置">
                        <span>↺</span> 重置
                    </button>
                </div>
                <div class="viz-controls-center">
                    <span class="step-info" id="stepInfo">步骤: 0 / 0</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>
                <div class="viz-controls-right">
                    <label class="speed-label">速度:</label>
                    <input type="range" class="speed-slider" id="speedSlider" min="0.25" max="4" step="0.25" value="1">
                    <span class="speed-value" id="speedValue">1x</span>
                    <button class="viz-btn small" id="btnRandom" title="随机数据">
                        🎲
                    </button>
                </div>
            </div>

            <!-- 可视化画布 -->
            <div class="viz-canvas" id="vizCanvas">
                <div class="placeholder-message">
                    <div class="placeholder-icon">🎬</div>
                    <p>选择一个算法开始可视化演示</p>
                </div>
            </div>

            <!-- 步骤说明 -->
            <div class="step-description" id="stepDescription">
                <span class="step-label">当前操作:</span>
                <span class="step-text" id="stepText">--</span>
            </div>

            <!-- 过程记录面板 -->
            <div class="process-panel" id="processPanel">
                <div class="process-header">
                    <span class="process-title">📋 执行过程</span>
                    <button class="process-clear" id="btnClearProcess" title="清空记录">🗑</button>
                </div>
                <div class="process-list" id="processList">
                    <div class="process-empty">选择一个算法查看执行过程</div>
                </div>
            </div>

            <!-- 图例 -->
            <div class="viz-legend" id="vizLegend">
                <div class="legend-item">
                    <span class="legend-color comparing"></span>
                    <span>比较中</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color swapping"></span>
                    <span>交换中</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color sorted"></span>
                    <span>已排序</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color pivot"></span>
                    <span>枢轴</span>
                </div>
            </div>

            <!-- 自定义输入 -->
            <div class="custom-input">
                <label>自定义数据:</label>
                <input type="text" id="customInput" placeholder="例如: 64, 34, 25, 12, 22">
                <button class="apply-btn" id="btnApply">应用</button>
            </div>
        </div>

        <!-- 右侧代码面板 -->
        <aside class="code-sidebar">
            <!-- 伪代码面板 -->
            <div class="code-panel active" id="panel-pseudocode">
                <div class="code-panel-header">
                    <span>📝 伪代码</span>
                </div>
                <pre class="code-block" id="pseudocodeBlock"><code>请选择一个算法</code></pre>
            </div>
            
            <!-- Python代码面板 -->
            <div class="code-panel" id="panel-python">
                <div class="code-panel-header">
                    <span>🐍 Python</span>
                    <button class="copy-btn" onclick="copyCode('pythonCode')">复制</button>
                </div>
                <pre class="code-block" id="pythonCode"><code>请选择一个算法</code></pre>
            </div>
            
            <!-- 面板切换 -->
            <div class="code-panel-tabs">
                <button class="code-tab active" data-panel="pseudocode">伪代码</button>
                <button class="code-tab" data-panel="python">Python</button>
            </div>
        </aside>
    </main>

    <script src="main.js"></script>
</body>
</html>
