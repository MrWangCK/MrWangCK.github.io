<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法可视化 | Algorithm Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #0891b2;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --comparing: #ec4899;
            --swapping: #0891b2;
            --sorted: #10b981;
            --pivot: #f59e0b;
            --found: #22c55e;
            --shadow: rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
            --shadow: rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .logo span { color: var(--primary); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--primary);
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-tab {
            padding: 0.6rem 1.2rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-tab:hover {
            background: var(--bg-elevated);
            color: var(--text);
        }

        .category-tab.active {
            background: var(--primary);
            color: white;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-elevated);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
        }

        .speed-control label { font-size: 0.8rem; color: var(--text-muted); }

        .speed-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .speed-value {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            min-width: 35px;
        }

        /* Main */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* Algorithm Cards */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 2px;
        }

        .algorithm-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .algorithm-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .algorithm-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .algorithm-card.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(8,145,178,0.08));
        }

        .algorithm-card-icon { font-size: 1.4rem; margin-bottom: 0.4rem; }
        .algorithm-card-name { font-size: 0.85rem; font-weight: 500; }
        .algorithm-card-complexity { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem; }

        /* Algorithm Info */
        .algorithm-info {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        @media (max-width: 768px) {
            .algorithm-info { grid-template-columns: 1fr; }
        }

        .algorithm-info h2 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .algorithm-info p { font-size: 0.85rem; color: var(--text-muted); }

        .complexity-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .complexity-badge {
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .complexity-badge.best { background: rgba(16,185,129,0.15); color: var(--success); }
        .complexity-badge.avg { background: rgba(245,158,11,0.15); color: var(--warning); }
        .complexity-badge.worst { background: rgba(239,68,68,0.15); color: var(--error); }
        .complexity-badge.space { background: rgba(8,145,178,0.15); color: var(--secondary); }

        /* Visualization */
        .visualization-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .visualization-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .visualization-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .visualization-title h2 { font-size: 1.1rem; }

        .visualization-badge {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .step-counter {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .step-counter span { color: var(--primary); font-weight: 600; }

        .progress-bar {
            width: 120px;
            height: 6px;
            background: var(--bg-elevated);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Canvas */
        .visualization-canvas {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg-elevated);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: auto;
            position: relative;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.75rem;
            background: var(--bg-elevated);
            border-radius: 8px;
            margin-top: 0.75rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* Array Visualization */
        .array-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .array-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
        }

        .array-bar-value {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .array-bar-inner {
            width: 32px;
            background: linear-gradient(180deg, var(--primary-light), var(--primary));
            border-radius: 4px 4px 0 0;
            transition: all 0.25s ease;
            min-height: 25px;
        }

        .array-bar.comparing .array-bar-inner { background: linear-gradient(180deg, #f472b6, #db2777); }
        .array-bar.swapping .array-bar-inner { background: linear-gradient(180deg, #22d3ee, #0891b2); }
        .array-bar.sorted .array-bar-inner { background: linear-gradient(180deg, #34d399, #059669); }
        .array-bar.pivot .array-bar-inner { background: linear-gradient(180deg, #fbbf24, #d97706); }
        .array-bar.found .array-bar-inner { background: linear-gradient(180deg, #4ade80, #16a34a); }

        /* Linked List */
        .linked-list-container {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ll-node { display: flex; align-items: center; }

        .ll-node-box {
            display: flex;
            border: 2px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
        }

        .ll-node-data {
            padding: 0.6rem 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 40px;
            text-align: center;
            background: var(--bg-card);
        }

        .ll-node-pointer {
            padding: 0.6rem 0.4rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            border-left: 2px solid var(--primary);
        }

        .ll-arrow {
            width: 25px;
            height: 2px;
            background: var(--primary);
            position: relative;
            margin: 0 -2px;
        }

        .ll-arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            border: 4px solid transparent;
            border-left-color: var(--primary);
        }

        .ll-null {
            padding: 0.5rem 0.75rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            border: 2px dashed var(--border);
            border-radius: 6px;
        }

        .ll-node.highlight .ll-node-box { border-color: var(--comparing); }
        .ll-node.highlight .ll-node-data { background: rgba(236,72,153,0.1); color: var(--comparing); }
        .ll-node.inserting .ll-node-box { border-color: var(--swapping); }
        .ll-node.sorted .ll-node-box { border-color: var(--sorted); }

        /* Tree */
        .tree-container {
            position: relative;
            min-width: 550px;
            min-height: 220px;
        }

        .tree-node {
            position: absolute;
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .tree-node.highlight { background: linear-gradient(135deg, #f472b6, #db2777); transform: scale(1.15); }
        .tree-node.sorted { background: linear-gradient(135deg, #34d399, #059669); }
        .tree-node.current { background: linear-gradient(135deg, #fbbf24, #d97706); transform: scale(1.15); }

        .tree-edge {
            position: absolute;
            background: var(--border);
            height: 2px;
            transform-origin: left center;
            z-index: 5;
        }

        .tree-edge.highlight { background: var(--comparing); height: 3px; }

        /* Graph */
        .graph-container {
            position: relative;
            width: 450px;
            height: 280px;
        }

        .graph-node {
            position: absolute;
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .graph-node.visited { background: linear-gradient(135deg, #34d399, #059669); }
        .graph-node.current { background: linear-gradient(135deg, #f472b6, #db2777); transform: scale(1.15); }
        .graph-node.in-queue { background: linear-gradient(135deg, #fbbf24, #d97706); }

        .graph-edge {
            position: absolute;
            height: 2px;
            background: var(--border);
            transform-origin: left center;
            z-index: 5;
        }

        .graph-edge.visited { background: var(--sorted); height: 3px; }

        .graph-edgeLabel {
            position: absolute;
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0 3px;
            border-radius: 3px;
        }

        /* Control Bar */
        .control-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem;
            background: var(--bg-elevated);
            border-radius: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.55rem 1rem;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn svg { width: 16px; height: 16px; }

        .control-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .control-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }

        .control-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .control-btn.secondary:hover { border-color: var(--primary-light); }

        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .control-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 0.5rem;
        }

        /* Code Panels */
        .code-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 900px) {
            .code-panels { grid-template-columns: 1fr; }
        }

        .code-panel {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .code-panel-header {
            background: var(--bg-elevated);
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .code-content {
            padding: 0.75rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            max-height: 280px;
        }

        .code-line {
            display: flex;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .code-line.active { background: rgba(99,102,241,0.15); }
        .code-line .line-number { color: var(--text-muted); min-width: 1.8rem; text-align: right; margin-right: 0.75rem; opacity: 0.5; }
        .code-line .line-content { flex: 1; }

        .code-keyword { color: #7c3aed; }
        .code-function { color: #0891b2; }
        .code-string { color: #059669; }
        .code-number { color: #d97706; }
        .code-comment { color: #94a3b8; font-style: italic; }
        .code-operator { color: #ec4899; }
        .code-type { color: #0891b2; }

        /* Step Description */
        .step-description {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .step-description h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .step-text { font-size: 0.95rem; }
        .step-text .highlight { color: var(--accent); font-weight: 600; }
        .step-text .value { color: var(--secondary); font-weight: 600; }

        /* Custom Input */
        .custom-input {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            border: 1px solid var(--border);
        }

        .custom-input h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 0.65rem 0.9rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .input-group input:focus { outline: none; border-color: var(--primary); }
        .input-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; }
        .input-error { color: var(--error); font-size: 0.75rem; margin-top: 0.4rem; display: none; }
        .input-error.show { display: block; }

        /* Completion Overlay */
        .completion-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .completion-overlay.show { opacity: 1; visibility: visible; }

        .completion-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 380px;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .completion-overlay.show .completion-card { transform: scale(1); }

        .completion-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--success), #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
        }

        .completion-title { font-size: 1.2rem; font-weight: 600; color: var(--success); margin-bottom: 0.4rem; }
        .completion-stats { color: var(--text-muted); margin-bottom: 1.5rem; }

        /* Animations */
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .array-bar.comparing { animation: pulse 0.4s ease infinite; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .array-bar { animation: fadeIn 0.3s ease; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.3rem 0.6rem;
            background: var(--text);
            color: var(--bg);
            font-size: 0.7rem;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .tooltip:hover::after { opacity: 1; visibility: visible; }

        /* Shortcuts hint */
        .shortcuts-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .shortcuts-hint kbd {
            background: var(--bg-elevated);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">

                      pseudocode:['procedure shellSort(arr)','    n ← length(arr)','    gap ← n / 2','    while gap > 0 do','        for i ← gap to n-1 do','            temp ← arr[i]','            j ← i','            while j >= gap and arr[j-gap] > temp do','                arr[j] ← arr[j-gap]','                j ← j - gap','            end while','            arr[j] ← temp','        end for','        gap ← gap / 2','    end while','end procedure'],
                      python:['def shell_sort(arr):','    n = len(arr)','    gap = n // 2','    while gap > 0:','        for i in range(gap, n):','            temp = arr[i]','            j = i','            while j >= gap and arr[j-gap] > temp:','                arr[j] = arr[j-gap]','                j -= gap','            arr[j] = temp','        gap //= 2','    return arr'],

                      gen:function*(a){const self=this;function*mg(l,m,r){const la=a.slice(l,m+1),ra=a.slice(m+1,r+1);yield{type:'compare',idx:Array.from({length:r-l+1},(_,i)=>l+i),d:`合并[${l}..${m}]和[${m+1}..${r}]`};let i=0,j=0,k=l;while(i<la.length&&j<ra.length){if(la[i]<=ra[j])a[k++]=la[i++];else a[k++]=ra[j++]}while(i<la.length)a[k++]=la[i++];while(j<ra.length)a[k++]=ra[j++];yield{type:'sorted',idx:Array.from({length:r-l+1},(_,i)=>l+i),d:`合并完成`}}function*ms(l,r){if(l<r){const m=Math.floor((l+r)/2);yield*ms(l,m);yield*ms(m+1,r);yield*mg(l,m,r)}}yield*ms(0,a.length-1);yield{type:'complete',d:'完成!'}},

                      python:['def quick_sort(arr, lo, hi):','    if lo < hi:','        pi = partition(arr, lo, hi)','        quick_sort(arr, lo, pi - 1)','        quick_sort(arr, pi + 1, hi)','','def partition(arr, lo, hi):','    pivot = arr[hi]','    i = lo - 1','    for j in range(lo, hi):','        if arr[j] <= pivot:','            i += 1','            arr[i], arr[j] = arr[j], arr[i]','    arr[i + 1], arr[hi] = arr[hi], arr[i + 1]','    return i + 1'],
                      gen:function*(a){function*pt(lo,hi){const pv=a[hi];yield{type:'pivot',idx:[hi],d:`pivot=${pv}`};let i=lo-1;for(let j=lo;j<hi;j++){yield{type:'compare',idx:[j,hi],d:`比较${a[j]}和${pv}`};if(a[j]<=pv){i++;if(i!==j){yield{type:'swap',idx:[i,j],d:`交换`};[a[i],a[j]]=[a[j],a[i]]}}}if(i+1!==hi){yield{type:'swap',idx:[i+1,hi],d:`pivot归位`};[a[i+1],a[hi]]=[a[hi],a[i+1]]}yield{type:'sorted',idx:[i+1],d:`${a[i+1]}就位`};return i+1}function*qs(lo,hi){if(lo<hi){const pi=yield*pt(lo,hi);yield*qs(lo,pi-1);yield*qs(pi+1,hi)}else if(lo===hi)yield{type:'sorted',idx:[lo],d:`${a[lo]}就位`}}yield*qs(0,a.length-1);yield{type:'complete',d:'完成!'}},

                      python:['def heap_sort(arr):','    n = len(arr)','    for i in range(n // 2 - 1, -1, -1):','        heapify(arr, n, i)','    for i in range(n - 1, 0, -1):','        arr[0], arr[i] = arr[i], arr[0]','        heapify(arr, i, 0)','','def heapify(arr, n, i):','    largest = i','    l, r = 2*i+1, 2*i+2','    if l < n and arr[l] > arr[largest]:','        largest = l','    if r < n and arr[r] > arr[largest]:','        largest = r','    if largest != i:','        arr[i], arr[largest] = arr[largest], arr[i]','        heapify(arr, n, largest)'],

                      pseudocode:['procedure countingSort(arr)','    max ← max(arr)','    count ← array(max+1, 0)','    // 统计','    for i ← 0 to n-1 do','        count[arr[i]] ← count[arr[i]] + 1','    // 累加','    for i ← 1 to max do','        count[i] ← count[i] + count[i-1]','    // 重建','    for i ← n-1 downto 0 do','        output[count[arr[i]]-1] ← arr[i]','end procedure'],
                      python:['def counting_sort(arr):','    max_val = max(arr)','    count = [0] * (max_val + 1)','    for val in arr:','        count[val] += 1','    for i in range(1, len(count)):','        count[i] += count[i - 1]','    output = [0] * len(arr)','    for val in reversed(arr):','        output[count[val] - 1] = val','        count[val] -= 1','    return output'],

                      gen:function*(a){const mv=Math.max(...a);let exp=1;while(Math.floor(mv/exp)>0){yield{type:'pivot',idx:[],d:`按第${exp}位`};const out=new Array(a.length),cnt=new Array(10).fill(0);for(let i=0;i<a.length;i++){const d=Math.floor(a[i]/exp)%10;cnt[d]++;yield{type:'compare',idx:[i],d:`${a[i]}第${exp}位=${d}`}}for(let i=1;i<10;i++)cnt[i]+=cnt[i-1];for(let i=a.length-1;i>=0;i--){const d=Math.floor(a[i]/exp)%10;out[cnt[d]-1]=a[i];cnt[d]--}a.splice(0,a.length,...out);yield{type:'sorted',idx:Array.from({length:a.length},(_,x)=>x),d:`完成:${a.join(',')}`};exp*=10}yield{type:'complete',d:'完成!'}},

                      pseudocode:['procedure dijkstra(graph, src)','    dist[src] ← 0','    for each v ≠ src do','        dist[v] ← ∞','    S ← empty set','    while src not in S do','        u ← vertex with min dist not in S','        add u to S','        for each neighbor v of u do','            if dist[u] + w(u,v) < dist[v] then','                dist[v] ← dist[u] + w(u,v)','    end while','end procedure'],
                      python:['import heapq','','def dijkstra(graph, src):','    dist = {v: float(\'inf\') for v in graph}','    dist[src] = 0','    pq = [(0, src)]','    while pq:','        d, u = heapq.heappop(pq)','        if d > dist[u]: continue','        for v, w in graph[u]:','            if dist[u] + w < dist[v]:','                dist[v] = dist[u] + w','                heapq.heappush(pq, (dist[v], v))','    return dist'],
                      gen:function*(g){const dist=new Array(g.nodes.length).fill(Infinity),vis=new Set();dist[0]=0;yield{type:'pivot',idx:[0],d:`起点A，距离0`};while(vis.size<g.nodes.length){let minD=Infinity,minI=-1;for(let i=0;i<dist.length;i++)if(!vis.has(i)&&dist[i]<minD){minD=dist[i];minI=i}if(minI===-1)break;vis.add(minI);yield{type:'current',idx:[minI],d:`访问${g.nodes[minI].v}，距离${dist[minI]}`};g.edges.forEach(e=>{if(e.f===minI&&!vis.has(e.t)){const nd=dist[minI]+e.w;if(nd<dist[e.t]){dist[e.t]=nd;yield{type:'queued',idx:[e.t],d:`${g.nodes[e.t].v}距离${nd}`}}}})}}yield{type:'complete',d:`完成!`}},
                    }
                ]
            }
        };

        // ==================== 状态 ====================
        const S = {
            cat:'sort', algo:null, arr:[], orig:[], steps:[], step:-1, playing:false, speed:1, id:null, target:50
        };

        // ==================== DOM ====================
        const $ = id => document.getElementById(id);
        const catTabs = $('categoryTabs');
        const algoCards = $('algorithmCards');
        const algoInfo = $('algorithmInfo');
        const visualContainer = $('visualContainer');
        const controlBar = $('controlBar');
        const codePanels = $('codePanels');
        const canvas = $('visualizationCanvas');
        const legend = $('legend');

        // ==================== 初始化 ====================
        function init() {
            renderCats();
            selectCat('sort');
            bindEvents();
        }

        function renderCats() {
            catTabs.innerHTML = Object.keys(algorithmData).map(k =>
                `<button class="category-tab${k==='sort'?' active':''}" data-cat="${k}">${algorithmData[k].icon} ${algorithmData[k].name}</button>`
            ).join('');
        }

        function selectCat(cat) {
            S.cat = cat;
            S.algo = null;
            document.querySelectorAll('.category-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
            algoCards.innerHTML = algorithmData[cat].algorithms.map(a =>
                `<div class="algorithm-card" data-id="${a.id}"><div class="algorithm-card-icon">${a.icon}</div><div class="algorithm-card-name">${a.name}</div><div class="algorithm-card-complexity">${a.complexity.avg}</div></div>`
            ).join('');
            algoInfo.style.display = 'none';
            visualContainer.style.display = 'none';
            controlBar.style.display = 'none';
            codePanels.style.display = 'none';
            $('stepText').textContent = '请选择一个算法';
        }

        function selectAlgo(id) {
            const cat = algorithmData[S.cat];
            const a = cat.algorithms.find(x => x.id === id);
            if (!a) return;
            S.algo = a;
            S.arr = genData(a);
            S.orig = [...S.arr];
            S.steps = [];
            S.step = -1;

            document.querySelectorAll('.algorithm-card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
            $('algoName').textContent = a.name;
            $('algoDesc').textContent = a.desc;
            $('complexityBadges').innerHTML = `<span class="complexity-badge best">最佳 ${a.complexity.best}</span><span class="complexity-badge avg">平均 ${a.complexity.avg}</span><span class="complexity-badge worst">最差 ${a.complexity.worst}</span><span class="complexity-badge space">空间 ${a.complexity.space}</span>`;
            $('visualBadge').textContent = {array:'数组',linkedlist:'链表',tree:'树',graph:'图'}[a.visualType] || '数组';
            $('visualTitle').textContent = a.name + ' 可视化';
            $('inputHint').textContent = a.visualType === 'array' || a.visualType === 'linkedlist' ? '输入1-12个整数' : '暂不支持自定义';
            $('customInput').disabled = a.visualType !== 'array' && a.visualType !== 'linkedlist';
            $('applyInputBtn').disabled = a.visualType !== 'array' && a.visualType !== 'linkedlist';
            algoInfo.style.display = 'grid';
            visualContainer.style.display = 'block';
            controlBar.style.display = 'flex';
            codePanels.style.display = 'grid';
            legend.style.display = a.visualType === 'array' ? 'flex' : 'none';

            renderCode();
            renderViz();
            $('stepText').textContent = '点击开始';
            updateProgress();
        }

        function genData(a) {
            const n = a.visualType === 'linkedlist' ? 6 : 8;
            const base = S.cat === 'linkedlist' ? 10 : 15;
            const arr = Array.from({length: n}, () => Math.floor(Math.random() * 70) + base);
            if (S.cat === 'search') arr.sort((x,y) => x-y);
            S.target = arr[Math.floor(Math.random() * arr.length)];
            return arr;
        }

        // ==================== 代码渲染 ====================
        function renderCode() {
            const a = S.algo;
            const hl = c => !c ? '&nbsp;' : c.replace(/\b(procedure|function|def|if|elif|else|while|for|in|return|class|from|import|not|and|or|True|False|None|new|then|end|to|downto|break|continue)\b/g,'<span class="code-keyword">$1</span>').replace(/\b(\d+)\b/g,'<span class="code-number">$1</span>').replace(/#.*/g,'<span class="code-comment">$1</span>').replace(/(\+|-|\*|\/|=|<|>|<=|>=|←|→|<>)/g,'<span class="code-operator">$1</span>');
            $('pseudocodePanel').innerHTML = a.pseudocode.map((c,i) => `<div class="code-line" data-l="${i}"><span class="line-number">${i+1}</span><span class="line-content">${hl(c)}</span></div>`).join('');
            $('pythoncodePanel').innerHTML = a.python.map((c,i) => `<div class="code-line" data-l="${i}"><span class="line-number">${i+1}</span><span class="line-content">${hl(c)}</span></div>`).join('');
        }

        // ==================== 可视化渲染 ====================
        function renderViz() {
            const a = S.algo;
            switch (a.visualType) {
                case 'array': renderArr(); break;
                case 'linkedlist': renderLL(); break;
                case 'tree': renderTree(a); break;
                case 'graph': renderGraph(a); break;
            }
        }

        function renderArr() {
            const mx = Math.max(...S.arr);
            canvas.innerHTML = `<div class="array-container">${S.arr.map((v,i) => `<div class="array-bar" data-i="${i}"><span class="array-bar-value">${v}</span><div class="array-bar-inner" style="height:${(v/mx)*140+25}px"></div></div>`).join('')}</div>`;
        }

        function renderLL() {
            canvas.innerHTML = `<div class="linked-list-container">${S.arr.map((v,i) => `<div class="ll-node" data-i="${i}"><div class="ll-node-box"><span class="ll-node-data">${v}</span><span class="ll-node-pointer">→</span></div></div>${i<S.arr.length-1?'<div class="ll-arrow"></div>':'<div class="ll-null">NULL</div>'}`).join('')}</div>`;
        }

        function renderTree(a) {
            const td = a.treeData;
            canvas.innerHTML = `<div class="tree-container" style="min-width:550px">${td.edges.map((e,i) => {const f=td.nodes[e.f],t=td.nodes[e.t],dx=t.x-f.x,dy=t.y-f.y,l=Math.sqrt(dx*dx+dy*dy),a2=Math.atan2(dy,dx)*180/Math.PI;return `<div class="tree-edge" data-i="${i}" style="left:${f.x+19}px;top:${f.y+19}px;width:${l-38}px;transform:rotate(${a2}deg)"></div>`}).join('')}${td.nodes.map((n,i) => `<div class="tree-node" data-i="${i}" style="left:${n.x}px;top:${n.y}px">${n.v}</div>`).join('')}</div>`;
        }

        function renderGraph(a) {
            const gd = a.graphData;
            canvas.innerHTML = `<div class="graph-container">${gd.edges.map((e,i) => {const f=gd.nodes[e.f],t=gd.nodes[e.t],dx=t.x-f.x,dy=t.y-f.y,l=Math.sqrt(dx*dx+dy*dy),a2=Math.atan2(dy,dx)*180/Math.PI,mx=(f.x+t.x)/2,my=(f.y+t.y)/2;return `<div class="graph-edge" data-i="${i}" style="left:${f.x+21}px;top:${f.y+21}px;width:${l-42}px;transform:rotate(${a2}deg)"></div><span class="graph-edgeLabel" style="left:${mx}px;top:${my-8}px">${e.w}</span>`}).join('')}${gd.nodes.map((n,i) => `<div class="graph-node" data-i="${i}" style="left:${n.x}px;top:${n.y}px">${n.v}</div>`).join('')}</div>`;
        }

        function updateViz(step) {
            const a = S.algo;
            const clearCls = cls => document.querySelectorAll('.'+cls).forEach(el => el.classList.remove(cls));
            clearCls('comparing'); clearCls('swapping'); clearCls('sorted'); clearCls('pivot'); clearCls('found'); clearCls('highlight'); clearCls('current'); clearCls('in-queue'); clearCls('inserting');

            if (!step) return;
            if (step.idx) step.idx.forEach(i => {
                const el = document.querySelector(`[data-i="${i}"]`);
                if (el && step.type) el.classList.add(step.type === 'compare' ? 'comparing' : step.type === 'swap' ? 'swapping' : step.type === 'pivot' ? 'pivot' : step.type === 'found' ? 'found' : 'sorted');
            });
        }

        // ==================== 算法执行 ====================
        function prepSteps() {
            const a = S.algo;
            S.steps = [];
            if (!a) return;

            if (a.visualType === 'array' || a.visualType === 'linkedlist') {
                let arr = [...S.orig];
                const gen = a.gen(arr, S.target);
                let r;
                while (!(r = gen.next()).done) S.steps.push({...r.value});
            } else if (a.visualType === 'tree') {
                const td = a.treeData;
                const nd = [...td.nodes];
                const ed = td.edges.map((e,i) => ({l:td.left[i],r:td.right[i]}));
                const gen = a.gen(nd, ed, S.target);
                let r;
                while (!(r = gen.next()).done) S.steps.push({...r.value});
            } else if (a.visualType === 'graph') {
                const gd = {...a.graphData};
                const gen = a.gen(gd);
                let r;
                while (!(r = gen.next()).done) S.steps.push({...r.value});
            }
        }

        function execStep(idx) {
            if (idx >= S.steps.length) { finish(); return; }
            const step = S.steps[idx];
            S.step = idx;
            $('stepCurrent').textContent = idx + 1;
            $('stepTotal').textContent = S.steps.length;
            $('stepText').innerHTML = step.d;
            updateViz(step);
            updateProgress();
        }

        function updateProgress() {
            const pct = S.steps.length ? ((S.step + 1) / S.steps.length * 100) : 0;
            $('progressFill').style.width = pct + '%';
        }

        async function play() {
            if (S.steps.length === 0) prepSteps();
            if (S.step >= S.steps.length - 1) { reset(); return; }
            S.playing = true;
            updateCtrl();
            while (S.playing && S.step < S.steps.length - 1) {
                await new Promise(r => setTimeout(r, 400 / S.speed));
                execStep(++S.step);
            }
            if (S.step >= S.steps.length - 1) finish();
            S.playing = false;
            updateCtrl();
        }

        function pause() {
            S.playing = false;
            updateCtrl();
        }

        function stepFwd() {
            if (S.steps.length === 0) prepSteps();
            if (S.step < S.steps.length - 1) execStep(++S.step);
            else finish();
        }

        function stepBack() {
            if (S.step > 0) execStep(--S.step);
        }

        function reset() {
            pause();
            S.arr = [...S.orig];
            S.step = -1;
            S.steps = [];
            renderViz();
            $('stepCurrent').textContent = '0';
            $('stepTotal').textContent = '0';
            $('stepText').textContent = '点击开始';
            updateProgress();
            updateCtrl();
        }

        function finish() {
            pause();
            $('completionTitle').textContent = S.algo.name + ' 完成!';
            $('completionStats').textContent = `共 ${S.steps.length} 步`;
            $('completionOverlay').classList.add('show');
        }

        function updateCtrl() {
            const run = S.playing;
            $('startBtn').className = `control-btn ${run?'secondary':'primary'}`;
            $('startIcon').textContent = run ? '⏸' : '▶';
            $('startText').textContent = run ? '暂停' : '开始';
            $('prevBtn').disabled = run || S.step <= 0;
        }

        // ==================== 事件 ====================
        function bindEvents() {
            catTabs.addEventListener('click', e => { const t = e.target.closest('.category-tab'); if (t) selectCat(t.dataset.cat); });
            algoCards.addEventListener('click', e => { const t = e.target.closest('.algorithm-card'); if (t) selectAlgo(t.dataset.id); });
            $('startBtn').addEventListener('click', () => S.playing ? pause() : play());
            $('nextBtn').addEventListener('click', stepFwd);
            $('prevBtn').addEventListener('click', stepBack);
            $('resetBtn').addEventListener('click', reset);
            $('randomBtn').addEventListener('click', () => { if (!S.playing && S.algo) { S.arr = genData(S.algo); S.orig = [...S.arr]; reset(); renderViz(); }});

            $('speedSlider').addEventListener('input', e => { S.speed = parseFloat(e.target.value); $('speedValue').textContent = S.speed + 'x'; });

            $('applyInputBtn').addEventListener('click', () => {
                const v = $('customInput').value.trim();
                if (!v) return;
                const nums = v.split(/[,，\s]+/).map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0 && n < 100);
                if (nums.length < 1 || nums.length > 12) { $('inputError').classList.add('show'); return; }
                $('inputError').classList.remove('show');
                S.arr = nums; S.orig = [...nums]; S.target = nums[Math.floor(Math.random() * nums.length)];
                reset(); renderViz();
            });

            $('themeToggle').addEventListener('click', () => {
                document.body.dataset.theme = document.body.dataset.theme === 'dark' ? '' : 'dark';
                $('themeToggle').textContent = document.body.dataset.theme === 'dark' ? '☀️' : '🌙';
            });

            $('closeCompletionBtn').addEventListener('click', () => $('completionOverlay').classList.remove('show'));

            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') { e.preventDefault(); S.playing ? pause() : play(); }
                if (e.code === 'ArrowRight') stepFwd();
                if (e.code === 'ArrowLeft') stepBack();
                if (e.code === 'KeyR') reset();
            });
        }

        init();
    </script>
</body>
</html>
