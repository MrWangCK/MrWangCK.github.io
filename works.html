<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .back-home {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        .back-home:hover {
            background: rgba(255,255,255,0.3);
        }
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .work-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .work-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .work-card .preview {
            height: 160px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .work-card:nth-child(2) .preview {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .work-card:nth-child(3) .preview {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .work-card .info {
            padding: 20px;
        }
        .work-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .work-card p {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-home" href="home.html">← 返回首页</a>
        <h1>🎨 我的作品集</h1>
        <div class="works-grid">
            <a class="work-card" href="index.html">
                <div class="preview">📊</div>
                <div class="info">
                    <h3>算法可视化</h3>
                    <p>交互式数据结构与算法动画演示工具</p>
                </div>
            </a>
            </div>
    </div>
</body>
</html>
